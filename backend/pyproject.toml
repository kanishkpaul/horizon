[project]
name = "horizon"
version = "0.1.0"
description = "Project Horizon: local-first opportunity intelligence and decision simulation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "openpyxl>=3.1",
  "numpy>=2.0",
  "scipy>=1.14",
  "networkx>=3.3",
  "ortools>=9.10",
  "fastembed>=0.4",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["horizon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
