# Preset policies. `actions` is the priority order; `contingent` actions stay off until a
# rule enables them; rules fire once per world when their condition first holds.
# These are starting points for comparison and for the strategy search, not recommendations.

- id: research_first
  name: Research-first
  description: Submit the register paper now, publish MCW, convert research outreach into collaborations, apply to predoc, research-intern and PhD routes.
  max_parallel: 4
  actions: [reg_paper_arr_oct, mcw_benchmark_release, outreach_faculty, mcw_preprint, predoc_applications,
            phd_applications, collab_research_1, collab_research_2, reg_preprint, research_intern_applications,
            mcw_submit_ml_venue, oss_eval_contribs]
  contingent: [reg_paper_arr_next]
  rules:
    - {label: "Missed the October ARR deadline → resubmit next cycle", when: {missed: reg_paper_arr_oct}, enable: [reg_paper_arr_next]}

- id: research_engineer
  name: Research-engineering industry track
  description: Light paper finish, public artifacts and OSS, founder outreach turned into trial projects, then targeted startup, big-tech and remote applications.
  max_parallel: 4
  actions: [reg_paper_arr_oct, mcw_benchmark_release, oss_eval_contribs, outreach_founders, collab_industry_1,
            collab_industry_2, startup_applications, reg_preprint, bigtech_applications, remote_global_applications,
            hackathons_q4]
  contingent: [reg_paper_arr_next]
  rules:
    - {label: "Missed October ARR → next cycle", when: {missed: reg_paper_arr_oct}, enable: [reg_paper_arr_next]}

- id: founder
  name: Founder track with safety net
  description: Build an MVP from an existing asset, seek traction, apply to an accelerator; keep targeted startup applications as a safety net.
  max_parallel: 3
  actions: [startup_mvp, outreach_founders, hackathons_q4, accelerator_application, collab_industry_1,
            startup_applications, kolkata_events]
  rules:
    - {label: "No traction by mid-February → widen job search", when: {all: [{week_ge: 18}, {token: traction, op: "<", value: 1}]}, enable: [bigtech_applications]}

- id: barbell
  name: Optionality barbell
  description: Keep research and industry routes alive in parallel; let early signals decide where hours go.
  max_parallel: 5
  actions: [reg_paper_arr_oct, mcw_benchmark_release, outreach_faculty, outreach_founders, predoc_applications,
            startup_applications, collab_research_1, collab_industry_1, reg_preprint, research_intern_applications,
            remote_global_applications, kolkata_events]
  contingent: [reg_paper_arr_next, mcw_preprint, collab_research_2, collab_industry_2, phd_applications]
  rules:
    - {label: "Missed October ARR → next cycle", when: {missed: reg_paper_arr_oct}, enable: [reg_paper_arr_next]}
    - {label: "Two research replies → double down on research", when: {token: leads_research, op: ">=", value: 2}, enable: [collab_research_2, mcw_preprint]}
    - {label: "Two founder replies → second trial project", when: {token: leads_industry, op: ">=", value: 2}, enable: [collab_industry_2]}

- id: artifact_led
  name: Artifact-led opportunity creation
  description: Ship public artifacts first, then run outreach that leads with them; collaborations and referrals then feed applications.
  max_parallel: 4
  actions: [mcw_benchmark_release, oss_eval_contribs, reg_paper_arr_oct, outreach_faculty, outreach_founders,
            collab_research_1, collab_industry_1, collab_research_2, collab_industry_2, predoc_applications,
            startup_applications, research_intern_applications, reg_preprint]
  contingent: [reg_paper_arr_next]
  rules:
    - {label: "Missed October ARR → next cycle", when: {missed: reg_paper_arr_oct}, enable: [reg_paper_arr_next]}

- id: conventional
  name: Conventional placement baseline
  description: Campus/off-campus job applications plus a few research-intern applications; no new research outputs.
  max_parallel: 3
  actions: [bigtech_applications, startup_applications, research_intern_applications, hackathons_q4]

- id: defer_depth
  name: Defer the paper, go for depth
  description: Skip the October deadline, complete validation for the next cycle, publish MCW and target an ML venue; predoc and PhD routes.
  max_parallel: 4
  actions: [reg_paper_arr_next, mcw_preprint, mcw_benchmark_release, predoc_applications, phd_applications,
            outreach_faculty, collab_research_1, mcw_submit_ml_venue, reg_preprint, research_intern_applications]

- id: max_parallel
  name: Maximum parallel portfolio
  description: Everything except the founder track, at high parallelism. Tests whether breadth beats focus under the hours model.
  max_parallel: 7
  actions: [reg_paper_arr_oct, mcw_benchmark_release, oss_eval_contribs, outreach_faculty, outreach_founders,
            predoc_applications, phd_applications, startup_applications, mcw_preprint, collab_research_1,
            collab_industry_1, collab_research_2, collab_industry_2, research_intern_applications,
            bigtech_applications, remote_global_applications, hackathons_q4, arc_prize_entry, kolkata_events,
            reg_preprint, mcw_submit_ml_venue]
  contingent: [reg_paper_arr_next]
  rules:
    - {label: "Missed October ARR → next cycle", when: {missed: reg_paper_arr_oct}, enable: [reg_paper_arr_next]}
