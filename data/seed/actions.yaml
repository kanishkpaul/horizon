    automatable: 0.0
    deadline: "2026-10-15T11:59:00Z"     # 48 h after the ARR deadline (VER-0001)
    deadline_basis: verified
    external_dependency: "A co-author with reviewing qualifications must register; undergraduates cannot serve."
    effects: {tokens: {arr_contributor_missing: -1}}

  - id: reg_paper_arr_next
    name: Complete validation and submit the register paper to the January ARR cycle (ACL 2027)
