# Uncertain parameters used by the simulator. Each is drawn once per simulated world
# (epistemic uncertainty), then outcomes are drawn given that value (aleatory), so
# value-of-information analysis can separate the two.
#
# dist: beta(a,b) | normal(mu,sd) | lognormal(median, gsd) | triangular(low,mode,high) | fixed(v) | bernoulli(p)
# origin: observed_base_rate | published_empirical | historical_user | calibrated |
#         expert_judgment | scenario_assumption | illustrative_placeholder | unknown
# Probabilities are per attempt for this person unless stated.

# --- peer review -------------------------------------------------------------
p_arr_main:
  description: P(main-conference acceptance | ARR submission of a typical-quality *ACL long paper)
  dist: beta(22, 78)
  origin: expert_judgment
  notes: Near the historical ~20-25% main-track range of ACL venues. Replace with the published rates from the params worker.
p_arr_findings_given_not_main:
  description: P(Findings | not accepted to main), ARR-based venue
  dist: beta(22, 78)
  origin: expert_judgment
logit_rushed_paper:
  description: Logit shift on acceptance for submitting before confirmatory runs and human labels are complete
  dist: normal(-0.5, 0.35)
  origin: expert_judgment
  notes: Causal assumption. Unfinished validation lowers reviewer scores. Sign is well motivated, size is not.
p_workshop_accept:
  description: P(acceptance at a relevant ML/NLP workshop)
  dist: beta(11, 9)
  origin: expert_judgment
p_ml_main_accept:
  description: P(acceptance | submission to ICML/NeurIPS-class venue, first-author undergrad benchmark paper)
  dist: beta(18, 82)
  origin: expert_judgment

# --- selection into positions ---------------------------------------------
p_predoc_offer:
  description: P(offer | complete application) for India research predoc / research-fellow programs (MSR India RF, Google Research India predoc class)
  dist: beta(3, 37)
  origin: expert_judgment
  notes: Highly selective; acceptance counts are rarely published.
p_research_intern_offer:
  description: P(offer | application) for research internships at labs/startups with posted openings
  dist: beta(4, 36)
  origin: expert_judgment
p_startup_offer_targeted:
  description: P(offer | targeted application with a relevant artifact) at an Indian AI startup
  dist: beta(6, 34)
  origin: expert_judgment
p_job_offer_cold_apply:
  description: P(offer | online application without referral) for an ML/research-engineer role
  dist: beta(2, 48)
  origin: expert_judgment
p_phd_admit:
  description: P(admit | application) to a strong PhD program for an Indian undergrad with preprints but no peer-reviewed paper
  dist: beta(2, 18)
  origin: expert_judgment
p_accelerator_accept:
  description: P(acceptance | application) to a top accelerator (YC-class)
  dist: beta(2, 98)
  origin: expert_judgment
p_hackathon_place:
  description: P(prize placement | entering a hackathon), given a strong prior record
  dist: beta(3, 7)
  origin: historical_user
  notes: 7-8 wins reported (user-supplied), number of entries unknown, so the prior is deliberately wide.
p_arc_prize_award:
  description: P(prize or paper award | serious ARC Prize entry)
  dist: beta(1, 60)
  origin: expert_judgment

