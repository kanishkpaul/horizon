p_project_to_offer:
  description: P(offer, paid role, or strong referral | completed scoped project)
  dist: beta(6, 12)
  origin: expert_judgment
  sources: ["PAR-0045 US intern→full-time conversion 62–63% (different population; upper anchor)"]
p_oss_merge:
