  dist: beta(9, 1)
  origin: expert_judgment
  sources: ["Params worker: since Jan 2026 new arXiv authors need a peer endorsement; 2 submissions/month cap (PAR-0020)"]

# --- evidence effects (logit shifts; causal assumptions, see ASSUMPTIONS.md) -------
bonus_peer_reviewed:
  description: Logit shift on research-position selection from one peer-reviewed paper
  dist: normal(0.5, 0.35)
  origin: expert_judgment
bonus_preprint:
  description: Logit shift from a public preprint or benchmark release
  dist: normal(0.2, 0.2)
  origin: expert_judgment
bonus_referral:
  description: Logit shift from a referral or warm introduction (causal effect, net of selection)
  dist: normal(1.2, 0.5)
  origin: expert_judgment
  sources: ["PAR-0041/43: referred applicants got offers ~11× as often (logit difference ≈ 2.5) at one US firm"]
  notes: The observational gap includes selection (referred people are pre-screened), so the causal shift is set lower.
bonus_artifact:
  description: Logit shift from a relevant, inspectable technical artifact
  dist: normal(0.25, 0.2)
  origin: expert_judgment
bonus_hackathon:
  description: Logit shift on engineering/startup roles from a recent hackathon win
  dist: normal(0.1, 0.15)
  origin: expert_judgment
bonus_skill_mlsys:
  description: Logit shift on engineering roles from demonstrated GPU/inference systems depth
  dist: normal(0.25, 0.2)
  origin: expert_judgment
bonus_traction:
  description: Logit shift on accelerator acceptance from demonstrated traction
  dist: normal(0.8, 0.3)
  origin: expert_judgment
logit_remote_global:
  description: Logit shift for competing in global remote hiring pools from India without a referral
  dist: normal(-0.7, 0.4)
  origin: expert_judgment
logit_no_sem8_internship:
  description: Logit shift on research-internship offers if 8th-semester internships are not allowed (fewer usable openings)
  dist: normal(-0.8, 0.3)
  origin: expert_judgment

# --- latent factors (shared across outcomes) -----------------------------------------
load_portfolio:
  description: Loading of selection outcomes on the latent 'portfolio strength as judged by evaluators' factor
  dist: normal(0.5, 0.15)
  origin: scenario_assumption
  notes: Induces positive correlation between applications. Zero in the 'independent outcomes' model variant.
load_market:
  description: Loading of hiring outcomes on the latent hiring-market factor
  dist: normal(0.35, 0.1)
  origin: scenario_assumption

# --- unknown facts with value of information -------------------------------------------
sem8_internship_allowed:
  description: Whether the institution allows a full-time research internship in the 8th semester (Jan–Jun 2027)
