  dist: beta(3, 7)
  origin: expert_judgment
  sources: ["PAR-0052 weak-tie job transmission ~0.1% per tie (Rajkumar et al. 2022): ties matter in aggregate, not one at a time"]
p_arxiv_endorsement:
