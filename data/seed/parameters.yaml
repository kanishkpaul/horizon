# Uncertain parameters used by the simulator. Each is drawn once per simulated world
# (epistemic uncertainty), then outcomes are drawn given that value (aleatory), so
# value-of-information analysis can separate the two.
#
# dist: beta(a,b) | normal(mu,sd) | lognormal(median, gsd) | triangular(low,mode,high) | fixed(v) | bernoulli(p)
# origin: observed_base_rate | published_empirical | official_statistic | organizer_published | historical_user |
#         calibrated | expert_judgment | scenario_assumption | illustrative_placeholder | unknown
# `published_empirical` is used only when the number describes a population close to this person's
# situation. Published numbers about other populations inform `expert_judgment` priors and are cited.
# Evidence references (PAR-xxxx) point to research/agents/params/parameters.jsonl (accessed 2026-10-09).

# --- peer review -------------------------------------------------------------
p_arr_main:
  description: P(main-conference acceptance | ARR submission of a long paper with a reviewer-qualified senior co-author)
  dist: beta(20, 80)
  origin: published_empirical
  evidence_grade: A
  sources: ["PAR-0001 ACL 2025 main 20.3%", "PAR-0012 NAACL 2025 main ~22%", "PAR-0010 EMNLP 2026 main ~15% (falling)"]
  notes: Population rate. The register paper has Prof. Naskar as a co-author, which puts it in the better-than-average bin (PAR-0006).
p_arr_findings_given_not_main:
  description: P(Findings | not accepted to main), ARR-based venue
  dist: beta(21, 79)
  origin: published_empirical
  evidence_grade: A
  sources: ["PAR-0002 ACL 2025 Findings 16.7% of submissions → 0.167/0.797 ≈ 0.21 conditional"]
  notes: Main + Findings combined ≈ 0.37, close to the 39% reported for papers with a reviewer-qualified author (PAR-0006, grade C).
p_arr_desk_ok:
  description: P(passes ARR desk/format checks | service contributor registered)
  dist: beta(97, 3)
  origin: expert_judgment
logit_contributor_missing:
  description: Logit shift on passing the desk check if no qualified service contributor is registered within 48 h
  dist: normal(-2.0, 0.8)
  origin: expert_judgment
  sources: ["VER-0001 ARR Oct-2026 cycle: unregistered papers enter a lottery and may be desk-rejected"]
logit_rushed_paper:
  description: Logit shift on acceptance for submitting before confirmatory runs and human labels are complete
  dist: normal(-0.5, 0.35)
  origin: expert_judgment
  notes: Causal assumption. Unfinished validation lowers reviewer scores. The sign is well motivated; the size is not.
p_workshop_accept:
  description: P(acceptance at a relevant ML/NLP workshop)
  dist: beta(11, 9)
  origin: expert_judgment
  sources: ["PAR-0016: no reliable workshop-level data found"]
p_ml_main_accept:
  description: P(main-track acceptance | ICML/NeurIPS-class submission by a solo undergraduate outsider)
  dist: beta(10, 90)
  origin: expert_judgment
  sources: ["PAR-0014 NeurIPS 2025 24.5%", "PAR-0015 ICLR 2026 27.4%", "PAR-0007 ACL 2026 all-student outsider papers ~10% (grade C)"]
p_tmlr_accept:
  description: P(acceptance | TMLR submission of a technically sound first paper; criterion is correctness and interest, not novelty)
  dist: beta(9, 11)
  origin: expert_judgment
  sources: ["PAR-0017 TMLR 2025 70.6% of decided papers", "PAR-0018 46.3% of all submissions", "PAR-0019 median 104 days to decision"]
p_semeval_paper:
  description: P(system-description paper accepted | completed SemEval task participation)
  dist: beta(8, 2)
  origin: expert_judgment
  notes: System papers for completed participations are usually accepted; not verified for 2027.

# --- selection into positions ---------------------------------------------
p_predoc_offer:
  description: P(offer | complete application) for India research predoc / research-fellow programs (MSR India RF class)
  dist: beta(3, 37)
  origin: unknown
  sources: ["PAR-0027: no published acceptance data for MSR India Research Fellows"]
  notes: Scenario prior only. Highly selective; record real outcomes to calibrate.
p_research_intern_offer:
  description: P(offer | application) for research internships with posted openings
  dist: beta(4, 46)
  origin: expert_judgment
  sources: ["PAR-0022 GSoC 2026 7.5% of applicants", "PAR-0024 MATS ~4.3% (grade C)"]
p_startup_offer_targeted:
  description: P(offer | targeted application with a relevant artifact) at an Indian AI startup
  dist: beta(5, 40)
  origin: expert_judgment
p_job_offer_cold_apply:
  description: P(offer | online application without referral) for an ML/research-engineer role
  dist: beta(1.5, 60)
  origin: expert_judgment
  sources: ["PAR-0042 job-board offer rate 0.27% for all applicants at one US firm (Brown, Setren & Topa 2016)"]
  notes: Higher than the population rate because applications are targeted and the profile is strong; still small.
p_phd_admit:
  description: P(funded admit | application) to a strong PhD program for an Indian undergrad with preprints but no peer-reviewed paper
  dist: beta(2, 18)
  origin: expert_judgment
p_accelerator_accept:
  description: P(acceptance | application) to a top accelerator (YC-class)
  dist: beta(1.5, 98)
  origin: published_empirical
  evidence_grade: A
  sources: ["PAR-0030 YC acceptance ~0.6–1.0%"]
p_hackathon_place:
  description: P(prize placement | entering a hackathon), given a strong prior record
  dist: beta(2.5, 7.5)
  origin: historical_user
  sources: ["PAR-0037/38 SIH 2025: 2.0% of teams reach the finale; ~20% of finalists win"]
  notes: 7–8 wins reported (user-supplied); number of entries unknown, so the prior is wide.
p_arc_prize_award:
  description: P(prize or paper award | ARC Prize 2026 paper-track entry)
  dist: beta(1, 30)
  origin: expert_judgment
  sources: ["PAR-0035 ARC Prize 2025: 1,455 teams; paper-track recognition prior Beta(1.6,16.4)", "VER-0008 ARC Prize 2026 prize structure", "DSC-0047: ARC-AGI-3 near-saturated by frontier models (62.7–99.9% by harness), so the leaderboard route is closed for Virgil"]
p_spar_accept:
  description: P(acceptance | SPAR application), part-time virtual research program
  dist: beta(2, 8)
  origin: expert_judgment
  sources: ["VER-0020 SPAR Spring 2027 opens ~December; undergraduates eligible"]

# --- outreach and relationships ------------------------------------------------
