  dist: beta(3, 9)
  origin: expert_judgment
  sources: ["PAR-0047 US faculty answered 67% of meeting requests (upper bound)", "PAR-0048 43% within 24 h in Australia", "PAR-0049 suggested Beta(1.5,6) for international undergrads"]
  notes: Audit studies show a penalty for South Asian names; the ask here is costlier than a meeting.
p_reply_founder:
  description: P(substantive reply | personalised cold email to founder/engineering lead with a relevant artifact)
  dist: beta(3, 12)
  origin: unknown
  sources: ["PAR-0050: no credible data; estimate from your own outreach log"]
p_reply_to_project:
