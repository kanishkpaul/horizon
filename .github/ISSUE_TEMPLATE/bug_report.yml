name: Bug report
description: Report observable behavior in the current implementation.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Horizon is under construction. Check docs/STATUS.md before reporting a missing capability.
        Use synthetic examples. Do not upload private cases, documents, contacts, or keys.
  - type: input
    id: revision
    attributes:
      label: Revision and environment
      description: Commit, OS, relevant tool versions, and enabled capabilities.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduce
      description: Minimal synthetic input and steps, expected behavior, and observed behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and impact
      description: Sanitized output, affected contract, and any recovery needed.
